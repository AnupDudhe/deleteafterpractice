apiVersion:  apps/v1 
kind:  StatefulSet
metadata:  
     name: ssdb
     labels:
        app: ssdb
spec:
   replicas: 1
   selector:
      matchLabels:
        app: ssdb
   template:
      metadata:
          name: ssdb 
          labels:
            app: ssdb
      spec:
         containers:
         - name: ssdb 
           image: mysql:latest 
           ports:
             - containerPort: 3306
               protocol: TCP 
           env: 
             - name: MYSQL_ROOT_PASSWORD 
               valueFrom: 
                  secretKeyRef:
                      name: ssdb-secret
                      key: root_pw