apiVersion: v1
kind: PersistentVolume
metadata:
    name:  pv-volume
    labels:
      type: pv
spec:
   storageClassName: standard
   volumeMode: Filesysystem
   accessModes:
      - ReadWriteOnce
   capacity:
      storage: 10Gi
   persistentVolumeReclaimPolicy: Recycle
   hostPath:
      path: "/mnt/data"