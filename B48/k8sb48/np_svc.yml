apiVersion: v1  #official library to create pod
kind: Pod   #unique naming convention to create 
metadata: 
   name: nginxnppod
   labels:   #tags
        app: nginxnppod
spec:
    containers:
        - name: nginxnppod
          image: nginx:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
   name: nodeportsvcsvc
spec:
   type: NodePort
   selector:
        app: nginxnppod
   ports: 
      - protocol: TCP 
        port: 80 #pod port 
        targetPort: 80 # container 

