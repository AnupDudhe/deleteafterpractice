apiVersion: apps/v1
metadata:
    name: dbsscm
    labels:
      app: dbsscm
kind: StatefulSet
spec:
   replicas: 3 
   selector:
      matchLabels:
         app: dbsscm
   template:
      metadata:
        name: dbsscm
        labels:
          app: dbsscm
      spec:
        containers:
          - name: dbsscm
            image: mysql:latest
            ports:
              - containerPort: 3306
            env:
             - name: MYSQL_ROOT_PASSWORD 
               valueFrom:
                configMapKeyRef:
                    name: ssdb-configmap   #encrypt with the help of secrets object.
                    key: root_pw2