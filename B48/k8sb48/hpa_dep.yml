apiVersion: apps/v1  
metadata:
    name: mydeployment
    labels:
       app: my-app
kind:  Deployment
spec:
   replicas: 1 #desired state 
   selector:
      matchLabels:
         app: nginxpod
   strategy: 
      type: RollingUpdate
      rollingUpdate:
         maxSurge: 1 #no of newly updated pods created 
         maxUnavailable: 1 #no of older version pod deleted at a time
   template:
      metadata:
        labels:
          app: nginxpod
      spec:
        containers:
          - name: nginxpodrs
            image: nginx:latest 
            ports:
              - containerPort: 80
            resources:
              requests:  #lower limit  
                  cpu: "100m"
                  memory: "256Mi"                #vertical scaling
              limits:   #upper limit 
                  cpu: "500m"
                  memory: "512Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
   name: my-hpa 
   labels:
     app: my-hpa
spec:
  minReplicas: 1
  maxReplicas: 3
  scaleTargetRef:
     apiVersion: apps/v1  
     kind:  Deployment
     name: mydeployment
  metrics:
    - type: Resource
      resource:
         name: cpu 
         target:
           type: Utilization
           averageUtilization: 50
  
