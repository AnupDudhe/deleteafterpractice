apiVersion: v1  #official library to create pod
kind: Pod   #unique naming convention to create 
metadata: 
   name: nginxpod
   labels:   #tags
        app: webapppod
spec:
    volumes: 
          - name: mypd 
            persistentVolumeClaim:
               claimName: pv-claim 
    containers:
        - name: nginxpod
          image: nginx:latest
          volumeMounts: 
            - mountPath: "/share/local/nginx" #container location
              name: mypd
          ports:
            - containerPort: 80